<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New customer</title>

    <style>

        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* SFONDO */
        body {
            background: linear-gradient(270deg, #0a192f, #112d4e, #1e3c72);
            background-size: 600% 600%;
            animation: bgMove 12s ease infinite;
            color: white;
            padding: 40px;
        }

        /* ANIMAZIONE SFONDO */
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* TITOLO */
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        /* FORM */
        form {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 40px rgba(0,119,255,0.3);
            animation: slideUp 1s ease;
        }

        /* INPUT */
        form div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            transition: 0.3s;
        }

        input:focus {
            background: rgba(255,255,255,0.2);
            box-shadow: 0 0 10px #00aaff;
            transform: scale(1.02);
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #007bff, #00d4ff);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0,150,255,0.6);
        }

        /* ERRORI */
        .validationError {
            color: #ff4d4d;
            font-size: 0.8rem;
        }

        /* ANIMAZIONE */
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

    </style>
</head>

<body>

<h1>Insert new customer</h1>

<form method="POST" th:object="${customer}">

    <div>
        <label>Name:</label>
        <input type="text" th:field="${customer.name}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('name')}"
              th:errors="${customer.name}">Name Error
        </span>
    </div>

    <div>
        <label>Surname:</label>
        <input type="text" th:field="${customer.surname}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('surname')}"
              th:errors="${customer.surname}">Name Error
        </span>
    </div>

    <div>
        <label>Age:</label>
        <input type="number" th:field="${customer.age}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('age')}"
              th:errors="${customer.age}">Name Error
        </span>
    </div>

    <div>
        <label>City:</label>
        <input type="text" th:field="${customer.city}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('city')}"
              th:errors="${customer.city}">Name Error
        </span>
    </div>

    <div>
        <label>CC Number</label>
        <input type="text" th:field="${customer.ccnumber}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('ccnumber')}"
              th:errors="${customer.ccnumber}">Name Error
        </span>
    </div>

    <div>
        <label>CC Expiration</label>
        <input type="text" th:field="${customer.ccexpiration}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('ccexpiration')}"
              th:errors="${customer.ccexpiration}">Name Error
        </span>
    </div>

    <div>
        <label>CC CVV</label>
        <input type="text" th:field="${customer.cccvv}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('cccvv')}"
              th:errors="${customer.cccvv}">Name Error
        </span>
    </div>

    <button type="submit">Save</button>

</form>

</body>
</html>
