<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New customer</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #ffe4ec, #ffd6e7);
            margin: 0;
            padding: 40px;
        }

        /* Titolo */
        h1 {
            text-align: center;
            color: #d63384;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* Form container */
        form {
            max-width: 420px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(214, 51, 132, 0.15);
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* Blocchi input */
        form div {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        /* Label */
        label {
            font-size: 13px;
            margin-bottom: 6px;
            color: #b03060;
            font-weight: 500;
        }

        /* Input */
        input {
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid #ffc2d6;
            background: #fff0f6;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        /* Placeholder */
        input::placeholder {
            color: #d48aa5;
        }

        /* Focus */
        input:focus {
            border-color: #ff4da6;
            background: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 77, 166, 0.15);
        }

        /* Errori */
        .validationError {
            font-size: 12px;
            color: #ff3366;
            margin-top: 5px;
        }

        /* Bottone */
        button {
            margin-top: 10px;
            padding: 13px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ff4da6, #ff80bf);
            color: white;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        /* Hover */
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 77, 166, 0.3);
        }

        /* Click */
        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<h1>Insert new customer</h1>

<form method="POST" th:object="${customer}">

    <div>
        <label>Name:</label>
        <input type="text" th:field="${customer.name}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('name')}"
              th:errors="${customer.name}">Name Error
        </span>
    </div>

    <div>
        <label>Surname:</label>
        <input type="text" th:field="${customer.surname}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('surname')}"
              th:errors="${customer.surname}">Name Error
        </span>
    </div>

    <div>
        <label>Age:</label>
        <input type="number" th:field="${customer.age}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('age')}"
              th:errors="${customer.age}">Name Error
        </span>
    </div>

    <div>
        <label>City:</label>
        <input type="text" th:field="${customer.city}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('city')}"
              th:errors="${customer.city}">Name Error
        </span>
    </div>

    <div>
        <label>CC Number</label>
        <input type="text" th:field="${customer.ccnumber}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('ccnumber')}"
              th:errors="${customer.ccnumber}">Name Error
        </span>
    </div>

    <div>
        <label>CC Expiration</label>
        <input type="text" th:field="${customer.ccexpiration}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('ccexpiration')}"
              th:errors="${customer.ccexpiration}">Name Error
        </span>
    </div>

    <div>
        <label>CC CVV</label>
        <input type="text" th:field="${customer.cccvv}"/>
        <span class="validationError"
              th:if="${#fields.hasErrors('cccvv')}"
              th:errors="${customer.cccvv}">Name Error
        </span>
    </div>

    <button type="submit">Save</button>

</form>

</body>
</html>
